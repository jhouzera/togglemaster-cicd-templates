name: Promote Image to GitOps Dev

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      gitops-values-file:
        required: true
        type: string
      image-repository:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      image-digest:
        required: true
        type: string
      gitops-repo:
        required: false
        type: string
        default: "jhouzera/togglemaster-gitops"
    secrets:
      GITOPS_TOKEN:
        required: true
      GITOPS_REPO:
        required: false

permissions:
  contents: read

jobs:
  update-gitops:
    name: Promote ${{ inputs.service-name }} to dev
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-dev-${{ inputs.service-name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      GITOPS_REPO: ${{ inputs.gitops-repo != '' && inputs.gitops-repo || secrets.GITOPS_REPO || 'jhouzera/togglemaster-gitops' }}
      VALUES_FILE: ${{ inputs.gitops-values-file }}
      SERVICE_NAME: ${{ inputs.service-name }}
      IMAGE_REPOSITORY: ${{ inputs.image-repository }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      IMAGE_DIGEST: ${{ inputs.image-digest }}

    steps:
      - name: Validate promotion inputs
        id: inputs
        run: |
          if [[ "$GITOPS_REPO" == "$GITHUB_REPOSITORY" ]]; then
            echo "Error: GITOPS_REPO ($GITOPS_REPO) cannot be the application repository ($GITHUB_REPOSITORY)."
            echo "Please ensure GITOPS_REPO points to the GitOps repository (e.g. jhouzera/togglemaster-gitops)."
            exit 1
          fi

          case "$SERVICE_NAME" in
            auth-service)
              SERVICE_KEY=auth
              EXPECTED_VALUES_FILE=environments/dev/apps/auth-values.yaml
              ;;
            flag-service)
              SERVICE_KEY=flag
              EXPECTED_VALUES_FILE=environments/dev/apps/flag-values.yaml
              ;;
            targeting-service)
              SERVICE_KEY=targeting
              EXPECTED_VALUES_FILE=environments/dev/apps/targeting-values.yaml
              ;;
            evaluation-service)
              SERVICE_KEY=evaluation
              EXPECTED_VALUES_FILE=environments/dev/apps/evaluation-values.yaml
              ;;
            analytics-service)
              SERVICE_KEY=analytics
              EXPECTED_VALUES_FILE=environments/dev/apps/analytics-values.yaml
              ;;
            *)
              echo "Unsupported service: $SERVICE_NAME"
              exit 1
              ;;
          esac

          if [[ "$VALUES_FILE" != "$EXPECTED_VALUES_FILE" ]]; then
            echo "Values file does not match service: $VALUES_FILE"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Image tag must use semantic versioning: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Image digest is invalid"
            exit 1
          fi

          if [[ "$IMAGE_REPOSITORY" != */togglemaster-dev/"$SERVICE_NAME" ]]; then
            echo "Image repository must target togglemaster-dev/$SERVICE_NAME"
            exit 1
          fi

          echo "service-key=$SERVICE_KEY" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update image reference
        working-directory: gitops
        env:
          SERVICE_KEY: ${{ steps.inputs.outputs.service-key }}
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          values_file = Path(os.environ["VALUES_FILE"])
          if not values_file.is_file():
              raise FileNotFoundError(f"Values file not found: {values_file}")

          with values_file.open(encoding="utf-8") as file:
              values = yaml.safe_load(file) or {}

          try:
              image = values["services"][os.environ["SERVICE_KEY"]]["image"]
          except KeyError as error:
              raise ValueError("Expected services.<service>.image structure is missing") from error

          image["repository"] = os.environ["IMAGE_REPOSITORY"]
          image["tag"] = os.environ["IMAGE_TAG"]
          image["digest"] = os.environ["IMAGE_DIGEST"]

          with values_file.open("w", encoding="utf-8") as file:
              yaml.safe_dump(values, file, sort_keys=False)
          PY

      - name: Validate rendered manifests
        working-directory: gitops
        run: |
          helm lint charts/togglemaster -f "$VALUES_FILE"
          helm template "togglemaster-${SERVICE_NAME}" charts/togglemaster \
            -f charts/togglemaster/values.yaml \
            -f "$VALUES_FILE" >/dev/null

      - name: Create promotion pull request
        working-directory: gitops
        run: |
          if git diff --quiet -- "$VALUES_FILE"; then
            echo "GitOps already references this image"
            exit 0
          fi

          BRANCH_NAME="promotion/dev/${SERVICE_NAME}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "chore(gitops): promote ${SERVICE_NAME} to ${IMAGE_TAG}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITOPS_REPO}.git" "HEAD:${BRANCH_NAME}"

          cat > pull-request.md <<EOF
          ## Image promotion to dev

          - Service: \`${SERVICE_NAME}\`
          - Image: \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`
          - Tag: \`${IMAGE_TAG}\`
          - Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          gh pr create \
            --repo "$GITOPS_REPO" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(gitops): promote ${SERVICE_NAME} to ${IMAGE_TAG}" \
            --body-file pull-request.md