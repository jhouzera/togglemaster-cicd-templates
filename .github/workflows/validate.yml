name: Validate Service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-language:
        required: true
        type: string
      service-path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    env:
      AIOPS_DIR: ${{ github.workspace }}/.aiops
      GO_TEST_LOG: ${{ github.workspace }}/.aiops/go-test.log
      GO_LINT_LOG: ${{ github.workspace }}/.aiops/go-lint.log
      PY_VALIDATE_LOG: ${{ github.workspace }}/.aiops/python-validate.log
      PY_LINT_LOG: ${{ github.workspace }}/.aiops/python-lint.log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare AIOps workspace
        run: mkdir -p "$AIOPS_DIR"

      - name: Setup Go
        if: inputs.service-language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service-path }}/go.mod
          cache-dependency-path: ${{ inputs.service-path }}/go.sum

      - name: Build, test and vet Go
        id: go_tests
        if: inputs.service-language == 'go'
        working-directory: ${{ inputs.service-path }}
        run: |
          set -o pipefail
          go mod download
          go build ./...
          go test ./... 2>&1 | tee "$GO_TEST_LOG"
          go vet ./... 2>&1 | tee -a "$GO_TEST_LOG"

      - name: Lint Go
        id: go_lint
        if: inputs.service-language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          working-directory: ${{ inputs.service-path }}
          args: --out-format=colored-line-number

      - name: Setup Python
        if: inputs.service-language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ inputs.service-path }}/requirements.txt

      - name: Install and validate Python
        id: python_validate
        if: inputs.service-language == 'python'
        working-directory: ${{ inputs.service-path }}
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall . 2>&1 | tee "$PY_VALIDATE_LOG"

      - name: Lint Python
        id: python_lint
        if: inputs.service-language == 'python'
        working-directory: ${{ inputs.service-path }}
        run: |
          set -o pipefail
          pip install ruff==0.6.9
          ruff check . 2>&1 | tee "$PY_LINT_LOG"

      - name: Checkout CI templates tools
        if: always()
        uses: actions/checkout@v4
        with:
          repository: jhouzera/togglemaster-cicd-templates
          path: .ci-templates

      - name: Generate AIOps test analysis artifacts
        if: always()
        env:
          TEST_OUTCOME: ${{ inputs.service-language == 'go' && steps.go_tests.outcome || steps.python_validate.outcome }}
          LINT_OUTCOME: ${{ inputs.service-language == 'go' && steps.go_lint.outcome || steps.python_lint.outcome }}
          TEST_LOG_FILE: ${{ inputs.service-language == 'go' && env.GO_TEST_LOG || env.PY_VALIDATE_LOG }}
          LINT_LOG_FILE: ${{ inputs.service-language == 'go' && env.GO_LINT_LOG || env.PY_LINT_LOG }}
        run: |
          mkdir -p "$AIOPS_DIR"
          if [ -n "$LINT_LOG_FILE" ] && [ ! -f "$LINT_LOG_FILE" ]; then
            echo "Lint step output is available in job logs." > "$LINT_LOG_FILE"
          fi
          python3 .ci-templates/tests/aiops_analyze_test_results.py \
            --service-name "${{ inputs.service-name }}" \
            --service-language "${{ inputs.service-language }}" \
            --service-path "${{ inputs.service-path }}" \
            --test-outcome "$TEST_OUTCOME" \
            --lint-outcome "$LINT_OUTCOME" \
            --test-log "$TEST_LOG_FILE" \
            --lint-log "$LINT_LOG_FILE" \
            --output-dir "$AIOPS_DIR"

      - name: Publish AIOps artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-${{ inputs.service-name }}-${{ github.run_id }}
          path: ${{ env.AIOPS_DIR }}
          if-no-files-found: error
