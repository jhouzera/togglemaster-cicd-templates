name: Validate Service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-language:
        required: true
        type: string
      service-path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ inputs.service-name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.service-language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service-path }}/go.mod
          cache-dependency-path: ${{ inputs.service-path }}/go.sum

      - name: Build, test and vet Go
        if: inputs.service-language == 'go'
        working-directory: ${{ inputs.service-path }}
        run: |
          go mod download
          go build ./...
          go test ./...
          go vet ./...

      - name: Lint Go
        if: inputs.service-language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          working-directory: ${{ inputs.service-path }}

      - name: Setup Python
        if: inputs.service-language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ inputs.service-path }}/requirements.txt

      - name: Install and validate Python
        if: inputs.service-language == 'python'
        working-directory: ${{ inputs.service-path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall .

      - name: Lint Python
        if: inputs.service-language == 'python'
        working-directory: ${{ inputs.service-path }}
        run: |
          pip install ruff==0.6.9
          ruff check .
