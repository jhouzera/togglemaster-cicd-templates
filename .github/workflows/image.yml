name: Build and Publish Image

on:
  workflow_call:
    outputs:
      image-repository:
        description: "ECR repository of the published image"
        value: ${{ jobs.image.outputs.image-repository }}
      image-tag:
        description: "Semantic version tag of the published image"
        value: ${{ jobs.image.outputs.image-tag }}
      image-digest:
        description: "Immutable digest of the published image"
        value: ${{ jobs.image.outputs.image-digest }}
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string
      service-dockerfile:
        required: true
        type: string
      ecr-repository-prefix:
        required: false
        type: string
        default: togglemaster-dev
      image-tag:
        required: true
        type: string
      push-images:
        description: "Push images to ECR"
        type: boolean
        default: false
      environment:
        description: "Environment to use"
        type: string
        default: "ci-build"

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image-repository: ${{ steps.image-metadata.outputs.image-repository }}
      image-tag: ${{ steps.image-metadata.outputs.image-tag }}
      image-digest: ${{ steps.image-metadata.outputs.image-digest }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: inputs.push-images
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: inputs.push-images
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          if [[ "${{ inputs.push-images }}" == "true" && ! "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release image tags must use semantic versioning: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          if [[ "${{ inputs.push-images }}" == "true" ]]; then
            IMAGE_URI="${ECR_REGISTRY}/${{ inputs.ecr-repository-prefix }}/${{ inputs.service-name }}:${IMAGE_TAG}"
          else
            IMAGE_URI="local/${{ inputs.service-name }}:${IMAGE_TAG}"
          fi

          docker build --pull -f "${{ inputs.service-dockerfile }}" -t "${IMAGE_URI}" "${{ inputs.service-path }}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build-image.outputs.image_uri }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image to ECR
        if: inputs.push-images
        run: docker push "${{ steps.build-image.outputs.image_uri }}"

      - name: Read published image digest
        if: inputs.push-images
        id: image-metadata
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository-prefix }}/${{ inputs.service-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          IMAGE_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Published image digest is invalid: $IMAGE_DIGEST"
            exit 1
          fi

          {
            echo "image-repository=${ECR_REGISTRY}/${ECR_REPOSITORY}"
            echo "image-tag=$IMAGE_TAG"
            echo "image-digest=$IMAGE_DIGEST"
          } >> "$GITHUB_OUTPUT"
